name: Flirtey
description: >-
  Flirtey was a drone-delivery technology company founded in 2013 by Matthew Sweeny and
  Tom Bass, backed by Y Combinator. It pioneered autonomous unmanned aerial vehicle
  delivery, conducting the first FAA-approved drone delivery in the United States in 2016
  (Nevada) and running early delivery trials with partners including Domino's (the first
  pizza delivered by drone, in New Zealand) and 7-Eleven. Flirtey developed the Flirtey
  Eagle delivery drone and portable landing/loading systems aimed at medical, food, and
  retail last-mile logistics. The company is now defunct: it did not maintain a public
  developer program or API, and the flirtey.com domain has since been sold and now
  redirects to an unrelated business (us-stemcell.com). This API Evangelist profile is
  retained as a historical company record with no live API surface to enrich.
